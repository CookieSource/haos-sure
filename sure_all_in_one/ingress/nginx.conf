worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  access_log /dev/stdout;
  client_max_body_size 0;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
  }

  include /run/sure/direct.conf;

  server {
    listen 8099;

    # Home Assistant Supervisor is the only network client for this listener.
    # Loopback is retained for the container health/smoke test.
    allow 172.30.32.2;
    allow 127.0.0.1;
    deny all;

    location / {
      proxy_pass http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_set_header Accept-Encoding "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Ingress-Path $http_x_ingress_path;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      # Sure emits root-relative links and asset paths. Prefix them with the
      # per-installation ingress path that Supervisor supplies on every
      # request. Redirect and cookie rewriting cover response headers; the
      # filters cover assets, links, forms, and client-side route strings.
      proxy_redirect ~^https?://[^/]+/(.*)$ $forwarded_proto://$http_host${http_x_ingress_path}$1;
      proxy_redirect ~^/(.*)$ ${http_x_ingress_path}$1;
      sub_filter_once off;
      sub_filter_types text/html text/css application/javascript text/javascript application/json;
      sub_filter '="/' '="${http_x_ingress_path}';
      sub_filter "='/" "='${http_x_ingress_path}";
      sub_filter '"/' '"${http_x_ingress_path}';
      sub_filter "'/" "'${http_x_ingress_path}";
      sub_filter 'url(/' 'url(${http_x_ingress_path}';
      proxy_cookie_path / $http_x_ingress_path;
    }
  }
}
