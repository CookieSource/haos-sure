[program:sure-postgres]
priority=10
command=/usr/lib/postgresql/16/bin/postgres -D /data/postgres -c listen_addresses=127.0.0.1 -c unix_socket_directories=/run/postgresql
user=postgres
autostart=true
autorestart=true
startsecs=1
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
stopsignal=INT
stopwaitsecs=60

[program:sure-redis]
priority=20
command=/usr/bin/redis-server --bind 127.0.0.1 --protected-mode yes --port 6379 --dir /data/redis --appendonly yes --save 300 1
user=redis
autostart=true
autorestart=true
startsecs=1
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
stopsignal=TERM
stopwaitsecs=30

[program:sure-db-init]
priority=30
command=/usr/local/bin/sure-db-init
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:sure-web]
priority=40
command=/usr/local/bin/sure-web
autostart=true
autorestart=true
startsecs=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
stopsignal=TERM
stopwaitsecs=90
stopasgroup=true
killasgroup=true

[program:sure-worker]
priority=50
command=/usr/local/bin/sure-worker
autostart=true
autorestart=true
startsecs=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
stopsignal=TERM
stopwaitsecs=90
stopasgroup=true
killasgroup=true

[program:sure-ingress]
priority=55
command=/usr/sbin/nginx -g "daemon off;" -c /etc/nginx/nginx.conf
autostart=true
autorestart=true
startsecs=1
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
stopsignal=QUIT
stopwaitsecs=30

[program:sure-backups]
priority=60
command=/usr/local/bin/sure-backup-loop
autostart=true
autorestart=true
startsecs=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
